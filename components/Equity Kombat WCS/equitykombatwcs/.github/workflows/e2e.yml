name: Playwright E2E Tests

on:
  schedule:
    - cron: '0 2 * * *' # Runs daily at 2am UTC
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npx playwright install --with-deps
      - run: node EquityKombatWCS/static-server.js &
      - run: sleep 5 # Wait for server to start
      - run: npx playwright test --reporter=html
      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
      - name: Create Jira Issue on Failure
        if: failure()
        uses: atlassian/gajira-create@v3
        with:
          from: summary
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_PROJECT: YOURPROJECTKEY
          SUMMARY: 'E2E test failure in Playwright CI run'
          DESCRIPTION: 'See attached Playwright report for details.'
